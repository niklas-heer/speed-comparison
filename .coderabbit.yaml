# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - master

  path_instructions:
    - path: "src/leibniz.*"
      instructions: |
        This is a benchmark implementation using the Leibniz formula to calculate π.
        Review for:
        - Single-threaded execution only (no concurrency/parallelism)
        - Correct Leibniz formula implementation
        - Potential performance optimizations that don't involve parallelism
        - SIMD is allowed but should be in separate files (e.g., leibniz_simd.*)

    - path: "Earthfile"
      instructions: |
        This is a retained legacy reference, not the active execution path.
        New language/toolchain changes belong in dagger-poc/languages.py; do not
        require duplicate Earthly implementations as a migration prerequisite.

    - path: "dagger-poc/**"
      instructions: |
        Python Language declarations are the source of truth for Nix/Devbox tooling.
        The common Dagger runner prepares builds with bounded concurrency, awaits
        a materialization barrier, and then measures serially with fresh IDs.
        Review source/revision binding, complete tooling propagation, build-cache
        reuse without cached timings, failure retention, and metadata correctness.
        Automatic PR execution needs authorization for the exact head revision and
        an isolated engine. A catalog manifest alone does not authorize execution.

    - path: "docs/validation/**"
      instructions: |
        These are historical diagnostic records, including generated catalog and
        toolchain snapshots. Check provenance and internal consistency. Do not
        rewrite recorded rounds, source revisions or execution protocols to match
        newer code, or treat captured catalog JSON as an active second configuration.
        Measured source and later artifact-publication commits can correctly differ.

    - path: "*.py"
      instructions: |
        Python scripts for analysis and publishing.
        Review for:
        - Consistent chart styling (Tokyo Night theme)
        - Correct data handling from benchmark JSON files

    - path: ".github/workflows/**"
      instructions: |
        GitHub Actions workflows for CI/CD.
        Review for:
        - Trusted driver code and authorization bound to the exact source revision
        - One Dagger engine session per suite, bounded builds and serial timings
        - Lightweight affected-target/report checks instead of full-suite PR runs
        - Retain partial evidence on failure and keep publication separate
        - Keep client credentials out of unreviewed execution

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: auto
  issues:
    scope: auto
  jira:
    project_keys: []
  linear:
    team_keys: []
  pull_requests:
    scope: auto
