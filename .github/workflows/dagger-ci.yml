# Manual fallback using the same suite entry point intended for homelab Argo.
name: '[Dagger] Manual benchmark'

on:
  workflow_dispatch:
    inputs:
      languages:
        description: 'Targets separated by spaces (all for full coverage)'
        type: string
        default: 'c rust go python'
      quick_test:
        description: 'Use 10,000 rounds'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Prepare selected builds, then measure serially
        env:
          QUICK_TEST_ROUNDS: ${{ inputs.quick_test && '10000' || '' }}
          REQUESTED_TARGETS: ${{ inputs.languages }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          targets = os.environ['REQUESTED_TARGETS'].split()
          if not targets:
              raise SystemExit('Specify targets or all')
          subprocess.run([
              'uv', 'run', '--locked', '--project', 'dagger-poc', 'python',
              'dagger-poc/benchmark.py', '--revision', os.environ['SOURCE_REVISION'],
              '--output', 'results/manual', '--prepare-jobs', '2', '--', *targets,
          ], check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-evidence
          path: results/manual/
          if-no-files-found: warn
