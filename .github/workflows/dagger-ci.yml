# Optional portable adapter. Normal benchmarks run on homelab Argo Workflows.
name: '[Dagger] Manual benchmark'

on:
  workflow_dispatch:
    inputs:
      languages:
        description: 'Targets separated by spaces (all for full coverage)'
        type: string
        default: 'c rust go python'
      quick_test:
        description: 'Use 10,000 rounds'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate requested targets
        id: targets
        env:
          REQUESTED_TARGETS: ${{ inputs.languages }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'dagger-poc')
          from languages import LANGUAGES
          requested = os.environ['REQUESTED_TARGETS'].split()
          targets = list(LANGUAGES) if requested == ['all'] else requested
          if not targets or set(targets) - set(LANGUAGES):
              raise SystemExit('Specify known targets from dagger-poc/languages.py')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('targets=' + json.dumps(list(dict.fromkeys(targets))) + '\n')
          PY
  benchmark:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: ${{ fromJson(needs.prepare.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Run benchmark
        env:
          USE_LOCAL_IMAGES: '1'
          QUICK_TEST_ROUNDS: ${{ inputs.quick_test && '10000' || '' }}
          TARGET: ${{ matrix.target }}
        run: uv run --locked --project dagger-poc python dagger-poc/benchmark.py "$TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.target }}
          path: results/${{ matrix.target }}.json
          if-no-files-found: error
