name: CI

on:
  push:
    branches: [master]
    paths-ignore: ["docs/history/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Test pipeline and language definitions
        run: uv run --locked --project dagger-poc --extra dev pytest dagger-poc -q
      - name: Check Python syntax and undefined names
        run: uv run --locked --project dagger-poc --extra dev ruff check --select F821,F822,F823 dagger-poc
