name: '[Nix] Version Check'

on:
  schedule:
    - cron: '0 6 * * 2'
  workflow_dispatch:
    inputs:
      include_unstable:
        description: 'Include preview versions'
        type: boolean
        default: false
      dry_run:
        description: 'Report updates without creating a draft PR'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Check package versions
        working-directory: dagger-poc
        env:
          INCLUDE_UNSTABLE: ${{ inputs.include_unstable }}
        run: |
          ARGS=()
          if [ "$INCLUDE_UNSTABLE" = true ]; then ARGS+=(--include-unstable); fi
          uv run --locked python check_versions.py --json "${ARGS[@]}" > version-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: nix-version-report
          path: dagger-poc/version-report.json
      - name: Apply proposed updates and validate
        if: '!inputs.dry_run'
        working-directory: dagger-poc
        run: |
          uv run --locked python update_versions.py version-report.json
          uv run --locked --extra dev pytest -q
      - uses: peter-evans/create-pull-request@v6
        if: '!inputs.dry_run'
        with:
          branch: codex/nix-version-updates
          draft: true
          title: 'chore(nix): update pinned language packages'
          commit-message: 'chore(nix): update pinned language packages'
          add-paths: dagger-poc/languages.py
          body: |
            Proposes explicit package version updates from the Devbox catalog.
            Configuration tests passed. Run the affected targets in homelab Argo
            before merging; compiler changes may require source updates.
            Immutable flake revisions require a separate review.
